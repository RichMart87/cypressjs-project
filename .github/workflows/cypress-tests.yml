name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly regression against the live site, independent of code changes.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run against (workflow_dispatch only)'
        type: choice
        default: chrome
        options: [chrome, firefox, edge, electron]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CYPRESS_ENV: prod

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check

  api-tests:
    name: API tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run API suite
        uses: cypress-io/github-action@v6
        with:
          browser: electron
          spec: cypress/e2e/api/**/*.cy.js
          install: false

      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: cypress/reports
          retention-days: 14

  ui-tests:
    name: UI tests (${{ matrix.browser }}, group ${{ matrix.group }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
        group: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Split the 26 UI test-case specs into two roughly-even groups per
      # browser so the matrix parallelizes wall-clock time instead of just
      # fanning out by browser.
      - name: Select spec group
        id: specs
        run: |
          ALL_SPECS=$(find cypress/e2e/ui -name '*.cy.js' | sort)
          if [ "${{ matrix.group }}" = "1" ]; then
            SELECTED=$(echo "$ALL_SPECS" | awk 'NR % 2 == 1')
          else
            SELECTED=$(echo "$ALL_SPECS" | awk 'NR % 2 == 0')
          fi
          echo "list=$(echo "$SELECTED" | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Run UI spec group
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          spec: ${{ steps.specs.outputs.list }}
          install: false

      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.browser }}-${{ matrix.group }}
          path: cypress/reports
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.group }}
          path: cypress/screenshots
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.browser }}-${{ matrix.group }}
          path: cypress/videos
          retention-days: 7
